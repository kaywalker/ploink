# Publishes the static game (server/public) to GitHub Pages.
# Without the Node server the site runs in peer-to-peer mode (PeerJS or QR codes).
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

# Never cancel a running deployment, but skip queued ones in between.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Upload and deploy run in separate jobs (like GitHub's starter workflow): the artifact
  # listing can lag behind a just-finished upload, and the job switch gives it time.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: server/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
      # One retry if the artifact was still not listed.
      - if: steps.deployment.outcome == 'failure'
        run: sleep 45
      - id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
