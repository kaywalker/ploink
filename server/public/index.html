<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d0f1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Ploink</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Join screen -->
  <section id="join" class="screen">
    <div class="join-card">
      <h1 class="logo">PLO<span>I</span>NK</h1>
      <p class="tagline">Viele Handys, ein Spielfeld. Was oben rausfliegt, landet bei den anderen.</p>

      <form id="join-form" autocomplete="off" novalidate>
        <fieldset class="mode-picker">
          <legend>Spiel</legend>
          <label class="mode-option">
            <input type="radio" name="mode" value="blaster" checked>
            <strong>🚀 Blaster</strong>
            <small>Schieß auf die anderen</small>
          </label>
          <label class="mode-option">
            <input type="radio" name="mode" value="gallery">
            <strong>🎯 Schießbude</strong>
            <small>Handys nebeneinander</small>
          </label>
          <label class="mode-option">
            <input type="radio" name="mode" value="pong">
            <strong>🏓 Pong</strong>
            <small>Ball weiterspielen</small>
          </label>
        </fieldset>
        <fieldset class="net-picker">
          <legend>Verbindung</legend>
          <label class="mode-option">
            <input type="radio" name="net" value="auto" checked>
            <strong>🌐 Automatisch</strong>
            <small>Server oder Internet</small>
          </label>
          <label class="mode-option">
            <input type="radio" name="net" value="qr">
            <strong>📷 QR-Code</strong>
            <small>ohne Internet</small>
          </label>
        </fieldset>
        <label class="field">
          <span>Raum-Code</span>
          <input id="code" class="code-input" type="text" inputmode="numeric" pattern="[0-9]{2}" maxlength="2" placeholder="42" required>
        </label>
        <label class="field">
          <span>Dein Name</span>
          <input id="name" type="text" maxlength="16" placeholder="z.&nbsp;B. Alex" enterkeyhint="go">
        </label>
        <p id="join-error" class="error" role="alert" hidden></p>
        <button id="join-button" type="submit" class="btn">Los geht’s</button>
        <button id="random-code" type="button" class="btn btn-ghost">Zufälligen Raum erstellen</button>
      </form>

      <p class="hint">Alle, die denselben Code eingeben, landen in derselben Runde.</p>
    </div>
  </section>

  <!-- Game screen -->
  <section id="game" class="screen" hidden>
    <canvas id="field"></canvas>

    <header class="hud">
      <button id="room-badge" class="badge" type="button" aria-label="Spielerliste anzeigen">
        Raum <strong id="hud-code">--</strong>
        <span class="dot"></span>
        <span id="hud-count">1</span>&nbsp;👤
      </button>
      <div class="my-score">
        <span class="score-hits" title="Abgewehrt">✓ <strong id="hud-hits">0</strong></span>
        <span class="score-misses" title="Verpasst">✕ <strong id="hud-misses">0</strong></span>
      </div>
    </header>

    <div id="status" class="status"></div>
    <div id="toasts" class="toasts" aria-live="polite"></div>

    <aside id="board" class="board" hidden>
      <div class="board-head">
        <h2>Raum <span id="board-code">--</span></h2>
        <button id="board-close" class="icon-btn" type="button" aria-label="Schließen">✕</button>
      </div>
      <ol id="board-list" class="board-list"></ol>
      <p class="board-share">Freunde einladen: Code <strong id="board-code-2">--</strong> eingeben oder <span id="board-link"></span> öffnen.</p>
      <button id="leave" class="btn btn-ghost" type="button">Raum verlassen</button>
    </aside>

    <div id="offline" class="offline" hidden>Verbindung verloren – verbinde neu …</div>
  </section>

  <script src="shared/pong-hub.js"></script>
  <script src="shared/net.js"></script>
  <script src="game.js"></script>
</body>
</html>
