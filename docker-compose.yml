services:
  server:
    image: node:22
    working_dir: /app
    volumes:
      - ./server:/app
      - node_modules:/app/node_modules
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    environment:
      PORT: 3000
    ports:
      # Bound to all interfaces so phones in the same Wi-Fi can connect.
      - "${PORT_PREFIX:-30}80:3000"
    restart: unless-stopped

volumes:
  node_modules:
